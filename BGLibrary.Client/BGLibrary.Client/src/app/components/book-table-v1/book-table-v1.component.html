<p>book-table-v1 works!</p>
<p *ngIf="!books"><em>Loading... Please refresh once the ASP.NET backend has started. See <a href="https://aka.ms/jspsintegrationangular">https://aka.ms/jspsintegrationangular</a> for more details.</em></p>

<table *ngIf="books">
  <thead>
  <tr>
    <th>Id</th>
    <th>Title</th>
    <th>Year</th>
    <th>Genre</th>
    <th>Author</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let book of books">
    <td>{{ book.id }}</td>
    <td>{{ book.title }}</td>
    <td>{{ book.publishYear }}</td>
    <td>{{ book.genre }}</td>
    <td>{{ book.author }}</td>
  </tr>
  </tbody>
</table>
