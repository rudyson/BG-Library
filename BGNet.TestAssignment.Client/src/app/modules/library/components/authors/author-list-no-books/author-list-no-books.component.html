<div>
    <div>
        <div *ngIf="authorsResponse && !unableLoad">
            <div *ngIf="authorsResponse.data!.totalSize > 0">
                <mat-list>
                    <div mat-subheader>Authors</div>
                    <mat-list-item *ngFor="let author of authorsResponse.data?.entities">
                        <mat-icon matListItemIcon>mood</mat-icon>
                        <h4 matListItemTitle routerLink="/author/{{ author.id }}">{{ author.surname }} {{ author.name }}</h4>
                        <p matListItemLine>Id: {{ author.id }} • Birthday: {{ author.birthday }}</p>
                        <p matListItemMeta>
                            <button
                                mat-icon-button
                                color="warn"
                                aria-label="Delete"
                                type="button"
                                (click)="deleteAuthor(author.id)"
                                matTooltip="Delete"
                            >
                                <mat-icon>delete</mat-icon>
                            </button>
                            <button
                                mat-icon-button
                                color="accent"
                                aria-label="View information"
                                routerLink="/author/{{ author.id }}"
                                matTooltip="View/Update"
                            >
                                <mat-icon>info</mat-icon>
                            </button>
                        </p>
                    </mat-list-item>
                </mat-list>
                <mat-paginator
                    (page)="handlePaginationEvent($event)"
                    [pageIndex]="authorsResponse.data?.page! - 1"
                    [pageSize]="authorsResponse.data?.pageSize"
                    [length]="authorsResponse.data!.totalSize"
                    [disabled]="false"
                    [showFirstLastButtons]="true"
                    [pageSizeOptions]="this.pageSizeOptions"
                    [hidePageSize]="false"
                    aria-label="Select page"
                >
                </mat-paginator>
            </div>
            <ng-container *ngIf="authorsResponse?.errors">
                <ul class="validation-error-list">
                    <li *ngFor="let error of authorsResponse?.errors">
                        {{ error }}
                    </li>
                </ul>
            </ng-container>
            <div *ngIf="authorsResponse.data!.totalSize == 0">
                <h2>Author list is empty</h2>
                <p>Create first one:</p>
            </div>
            <button type="button" mat-flat-button color="accent" aria-label="Create author" routerLink="/author" matTooltip="Create author">
                <mat-icon>add</mat-icon>Create author
            </button>
        </div>
        <div *ngIf="!authorsResponse && !unableLoad">
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            <h2>Loading author list...</h2>
        </div>
        <div *ngIf="!authorsResponse && unableLoad">
            <h2>Failed to load authors. Network error.</h2>
        </div>
    </div>
</div>
