<div class="form-container">
    <form ngNativeValidate class="login-form" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
        <p>
            <mat-form-field appearance="fill">
                <mat-label>Enter your username</mat-label>
                <input matInput type="text" id="username" ngModel name="username" placeholder="Username" required autofocus />
            </mat-form-field>
        </p>
        <p>
            <mat-form-field>
                <mat-label>Enter your password</mat-label>
                <input
                    matInput
                    [type]="isPasswordVisible ? 'text' : 'password'"
                    id="password"
                    ngModel
                    name="password"
                    placeholder="Password"
                    required
                />
                <button
                    type="button"
                    mat-icon-button
                    matSuffix
                    (click)="isPasswordVisible = !isPasswordVisible"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="isPasswordVisible"
                >
                    <mat-icon>{{ isPasswordVisible ? "visibility_off" : "visibility" }}</mat-icon>
                </button>
            </mat-form-field>
        </p>
        <ng-container *ngIf="loginResponse?.errors">
            <ul class="validation-error-list">
                <li *ngFor="let error of loginResponse?.errors">
                    {{ error }}
                </li>
            </ul>
        </ng-container>
        <p>
            <button type="submit" mat-flat-button color="accent">Login</button>
        </p>
        <p>Still have no account? <a routerLink="/register">Register</a></p>
    </form>
</div>
